<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 8" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7ff" stop-opacity="0"/>
      <stop offset=".3" stop-color="#6ee7ff"/>
      <stop offset=".7" stop-color="#c9a7ff"/>
      <stop offset="1" stop-color="#c9a7ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="3" width="800" height="2" fill="url(#g)" opacity=".6"/>
  <circle cy="4" r="3" fill="#ffffff">
    <animate attributeName="cx" values="0;800" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
