<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" shape-rendering="crispEdges" role="img" aria-label="Animated pixel art of a developer coding on a rooftop at night with a cat, a glowing hologram and a city skyline">
  <title>Developer on a rooftop at night</title>

  <!-- SKY -->
  <rect width="160" height="90" fill="#0a0e24"/>
  <rect y="20" width="160" height="15" fill="#0f1635"/>
  <rect y="35" width="160" height="15" fill="#151d45"/>
  <rect y="50" width="160" height="12" fill="#1c2557"/>
  <rect y="62" width="160" height="16" fill="#26307a"/>

  <!-- STARS -->
  <g fill="#ffffff">
    <rect x="10" y="8" width="1" height="1"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="24" y="18" width="1" height="1"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="38" y="6" width="2" height="2"><animate attributeName="opacity" values="1;.3;1" dur="4s" begin="1s" repeatCount="indefinite"/></rect>
    <rect x="52" y="14" width="1" height="1"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="66" y="9" width="1" height="1"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" begin=".6s" repeatCount="indefinite"/></rect>
    <rect x="80" y="19" width="1" height="1"><animate attributeName="opacity" values=".3;1;.3" dur="3.6s" repeatCount="indefinite"/></rect>
    <rect x="94" y="7" width="2" height="2"><animate attributeName="opacity" values="1;.2;1" dur="4.4s" begin="2s" repeatCount="indefinite"/></rect>
    <rect x="106" y="22" width="1" height="1"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="18" y="29" width="1" height="1"><animate attributeName="opacity" values="1;.3;1" dur="3.2s" begin="1.4s" repeatCount="indefinite"/></rect>
    <rect x="60" y="27" width="1" height="1"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="88" y="31" width="1" height="1"><animate attributeName="opacity" values="1;.2;1" dur="3.8s" repeatCount="indefinite"/></rect>
    <rect x="142" y="31" width="1" height="1"><animate attributeName="opacity" values=".2;1;.2" dur="3s" begin=".8s" repeatCount="indefinite"/></rect>
    <rect x="150" y="9" width="1" height="1"><animate attributeName="opacity" values="1;.3;1" dur="2.7s" repeatCount="indefinite"/></rect>
    <rect x="6" y="38" width="1" height="1"><animate attributeName="opacity" values=".3;1;.3" dur="3.3s" repeatCount="indefinite"/></rect>
    <rect x="116" y="37" width="1" height="1"><animate attributeName="opacity" values="1;.2;1" dur="4.2s" begin="1.2s" repeatCount="indefinite"/></rect>
  </g>

  <!-- MOON -->
  <circle cx="128" cy="15" r="13" fill="#f4f1d0" opacity=".08">
    <animate attributeName="opacity" values=".06;.15;.06" dur="5s" repeatCount="indefinite"/>
  </circle>
  <g fill="#f4f1d0">
    <rect x="125" y="9" width="6" height="1"/>
    <rect x="123" y="10" width="10" height="1"/>
    <rect x="122" y="11" width="12" height="1"/>
    <rect x="121" y="12" width="14" height="6"/>
    <rect x="122" y="18" width="12" height="1"/>
    <rect x="123" y="19" width="10" height="1"/>
    <rect x="125" y="20" width="6" height="1"/>
  </g>
  <g fill="#d9d4a8">
    <rect x="124" y="12" width="2" height="2"/>
    <rect x="129" y="15" width="3" height="2"/>
    <rect x="125" y="17" width="2" height="1"/>
  </g>

  <!-- SHOOTING STAR -->
  <g opacity="0">
    <rect x="0" y="0" width="4" height="1" fill="#ffffff"/>
    <rect x="-3" y="-1" width="3" height="1" fill="#9fb4ff" opacity=".6"/>
    <animateTransform attributeName="transform" type="translate" values="150 6;150 6;108 26;108 26" keyTimes="0;.02;.14;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.02;.04;.14;1" dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- AIRPLANE LIGHT -->
  <rect y="13" width="1" height="1" fill="#ff5c5c">
    <animate attributeName="x" values="-2;162" dur="45s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- FAR SKYLINE -->
  <g fill="#1a2252">
    <rect x="0" y="52" width="10" height="26"/>
    <rect x="10" y="46" width="8" height="32"/>
    <rect x="18" y="56" width="12" height="22"/>
    <rect x="30" y="42" width="9" height="36"/>
    <rect x="39" y="54" width="11" height="24"/>
    <rect x="50" y="48" width="8" height="30"/>
    <rect x="58" y="58" width="13" height="20"/>
    <rect x="71" y="44" width="10" height="34"/>
    <rect x="81" y="53" width="9" height="25"/>
    <rect x="91" y="50" width="12" height="28"/>
    <rect x="103" y="57" width="8" height="21"/>
    <rect x="111" y="46" width="11" height="32"/>
    <rect x="122" y="55" width="9" height="23"/>
    <rect x="131" y="49" width="12" height="29"/>
    <rect x="143" y="56" width="8" height="22"/>
    <rect x="151" y="51" width="9" height="27"/>
  </g>
  <rect x="33" y="38" width="1" height="4" fill="#1a2252"/>
  <rect x="74" y="40" width="1" height="4" fill="#1a2252"/>
  <rect x="34" y="37" width="1" height="1" fill="#ff5c5c">
    <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>

  <!-- NEAR SKYLINE -->
  <g fill="#0f1538">
    <rect x="0" y="62" width="16" height="16"/>
    <rect x="16" y="58" width="10" height="20"/>
    <rect x="26" y="64" width="14" height="14"/>
    <rect x="110" y="60" width="12" height="18"/>
    <rect x="122" y="56" width="16" height="22"/>
    <rect x="138" y="64" width="10" height="14"/>
    <rect x="148" y="59" width="12" height="19"/>
  </g>

  <!-- WINDOWS -->
  <g fill="#ffd86b">
    <rect x="3" y="65" width="2" height="1"/>
    <rect x="11" y="65" width="2" height="1"><animate attributeName="opacity" values="1;1;0;1" keyTimes="0;.5;.55;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="7" y="70" width="2" height="1"/>
    <rect x="19" y="61" width="2" height="1"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.6;1" dur="9s" repeatCount="indefinite"/></rect>
    <rect x="23" y="66" width="2" height="1"/>
    <rect x="19" y="71" width="2" height="1"/>
    <rect x="29" y="67" width="2" height="1"/>
    <rect x="35" y="72" width="2" height="1"><animate attributeName="opacity" values="1;1;0;1" keyTimes="0;.3;.35;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="113" y="63" width="2" height="1"/>
    <rect x="118" y="68" width="2" height="1"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.7;1" dur="8s" repeatCount="indefinite"/></rect>
    <rect x="125" y="59" width="2" height="1"/>
    <rect x="131" y="59" width="2" height="1"><animate attributeName="opacity" values="1;1;0;1" keyTimes="0;.4;.45;1" dur="10s" repeatCount="indefinite"/></rect>
    <rect x="127" y="65" width="2" height="1"/>
    <rect x="134" y="70" width="2" height="1"/>
    <rect x="141" y="67" width="2" height="1"/>
    <rect x="144" y="72" width="2" height="1"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="151" y="62" width="2" height="1"/>
    <rect x="156" y="67" width="2" height="1"><animate attributeName="opacity" values="1;1;0;1" keyTimes="0;.8;.85;1" dur="11s" repeatCount="indefinite"/></rect>
  </g>

  <!-- RAILING AND FLOOR -->
  <defs>
    <pattern id="posts" x="0" y="0" width="12" height="8" patternUnits="userSpaceOnUse">
      <rect width="1" height="8" fill="#1f2a5e"/>
    </pattern>
  </defs>
  <rect x="0" y="70" width="160" height="1" fill="#2b3680"/>
  <rect x="0" y="70" width="160" height="8" fill="url(#posts)"/>
  <rect x="0" y="78" width="160" height="12" fill="#0a0d1f"/>
  <rect x="0" y="78" width="160" height="1" fill="#27327a"/>
  <rect x="0" y="83" width="160" height="1" fill="#121835"/>
  <rect x="0" y="87" width="160" height="1" fill="#121835"/>

  <!-- DESK -->
  <rect x="54" y="64" width="58" height="2" fill="#6b4a33"/>
  <rect x="54" y="64" width="58" height="1" fill="#8a6445"/>
  <rect x="56" y="66" width="2" height="12" fill="#4a3222"/>
  <rect x="108" y="66" width="2" height="12" fill="#4a3222"/>

  <!-- HOLOGRAM BEAM -->
  <polygon points="78,52 70,46 98,46" fill="#6ee7ff" opacity=".07">
    <animate attributeName="opacity" values=".04;.1;.04" dur="3s" repeatCount="indefinite"/>
  </polygon>

  <!-- HOLOGRAM PANEL -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="4s" repeatCount="indefinite"/>
    <rect x="68" y="24" width="32" height="22" fill="#6ee7ff" opacity=".08"/>
    <g fill="#6ee7ff" opacity=".65">
      <rect x="68" y="24" width="32" height="1"/>
      <rect x="68" y="45" width="32" height="1"/>
      <rect x="68" y="24" width="1" height="22"/>
      <rect x="99" y="24" width="1" height="22"/>
    </g>
    <rect x="70" y="26" width="1" height="1" fill="#ff5c8a"/>
    <rect x="72" y="26" width="1" height="1" fill="#ffd86b"/>
    <rect x="74" y="26" width="1" height="1" fill="#7dff9a"/>
    <!-- typing code lines -->
    <rect x="70" y="29" width="0" height="1" fill="#6ee7ff">
      <animate attributeName="width" values="0;14;14;0" keyTimes="0;.4;.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="32" width="0" height="1" fill="#ff7ad9">
      <animate attributeName="width" values="0;0;18;18;0" keyTimes="0;.12;.5;.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="35" width="0" height="1" fill="#ffd86b">
      <animate attributeName="width" values="0;0;10;10;0" keyTimes="0;.25;.6;.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="38" width="0" height="1" fill="#7dff9a">
      <animate attributeName="width" values="0;0;20;20;0" keyTimes="0;.35;.75;.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="41" width="0" height="1" fill="#6ee7ff">
      <animate attributeName="width" values="0;0;12;12;0" keyTimes="0;.5;.85;.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="43" width="2" height="1" fill="#ffffff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- LAPTOP -->
  <rect x="60" y="63" width="20" height="1" fill="#b9c2e8"/>
  <rect x="60" y="62" width="18" height="1" fill="#5a6390"/>
  <rect x="78" y="51" width="1" height="12" fill="#aab3e0"/>
  <rect x="77" y="52" width="1" height="10" fill="#7cf7ff">
    <animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- COFFEE MUG AND STEAM -->
  <rect x="107" y="60" width="4" height="4" fill="#f5f5f5"/>
  <rect x="111" y="61" width="1" height="2" fill="#f5f5f5"/>
  <rect x="107" y="60" width="4" height="1" fill="#6b3f1d"/>
  <g fill="#ffffff">
    <rect x="108" y="58" width="1" height="2" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="110" y="58" width="1" height="2" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="109" y="58" width="1" height="2" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;0" dur="3s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- CAT -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 90 63;18 90 63;0 90 63;-10 90 63;0 90 63" dur="3s" repeatCount="indefinite"/>
      <rect x="88" y="57" width="2" height="6" fill="#f2994a"/>
      <rect x="88" y="56" width="2" height="1" fill="#c9702a"/>
    </g>
    <rect x="90" y="59" width="10" height="5" fill="#f2994a"/>
    <rect x="93" y="59" width="1" height="2" fill="#c9702a"/>
    <rect x="96" y="59" width="1" height="2" fill="#c9702a"/>
    <rect x="99" y="55" width="6" height="5" fill="#f2994a"/>
    <rect x="99" y="54" width="1" height="1" fill="#f2994a"/>
    <rect x="104" y="54" width="1" height="1" fill="#f2994a"/>
    <rect x="100" y="55" width="1" height="1" fill="#ff8aa1"/>
    <rect x="103" y="55" width="1" height="1" fill="#ff8aa1"/>
    <rect x="101" y="57" width="1" height="1" fill="#7dff9a">
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;.9;.93;.96;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="103" y="57" width="1" height="1" fill="#7dff9a">
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;.9;.93;.96;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="102" y="58" width="1" height="1" fill="#ff8aa1"/>
  </g>

  <!-- DEVELOPER -->
  <!-- stool -->
  <rect x="36" y="70" width="12" height="2" fill="#3a2f5c"/>
  <rect x="41" y="72" width="2" height="6" fill="#2a2145"/>
  <rect x="38" y="77" width="8" height="1" fill="#2a2145"/>
  <!-- legs -->
  <rect x="40" y="68" width="12" height="3" fill="#2a3a6a"/>
  <rect x="50" y="71" width="3" height="6" fill="#2a3a6a"/>
  <rect x="50" y="76" width="6" height="2" fill="#f2f2f2"/>
  <!-- torso -->
  <rect x="38" y="57" width="8" height="11" fill="#7c5cff"/>
  <rect x="38" y="57" width="2" height="11" fill="#5e43d6"/>
  <!-- arm typing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 .6;0 0" dur=".5s" repeatCount="indefinite"/>
    <rect x="44" y="60" width="3" height="3" fill="#8a6bff"/>
    <rect x="46" y="62" width="13" height="2" fill="#8a6bff"/>
    <rect x="59" y="62" width="2" height="2" fill="#f0c8a0"/>
  </g>
  <!-- head: looks up at the moon, then back to the screen -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 43 56;0 43 56;-14 43 56;-14 43 56;0 43 56;0 43 56" keyTimes="0;.35;.45;.65;.75;1" dur="9s" repeatCount="indefinite"/>
    <rect x="41" y="55" width="3" height="2" fill="#f0c8a0"/>
    <rect x="40" y="48" width="8" height="8" fill="#f0c8a0"/>
    <rect x="39" y="46" width="10" height="3" fill="#2b2140"/>
    <rect x="39" y="48" width="2" height="6" fill="#2b2140"/>
    <rect x="40" y="45" width="8" height="1" fill="#ff5c8a"/>
    <rect x="41" y="50" width="3" height="4" fill="#ff5c8a"/>
    <rect x="46" y="51" width="1" height="2" fill="#1a1a2e">
      <animate attributeName="height" values="2;2;0;2;2" keyTimes="0;.88;.9;.92;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="52" width="1" height="1" fill="#f0c8a0"/>
  </g>
  <!-- sparkle when looking at the moon -->
  <g fill="#ffffff" opacity="0">
    <rect x="53" y="41" width="1" height="3"/>
    <rect x="52" y="42" width="3" height="1"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.35;.45;.65;.75;1" dur="9s" repeatCount="indefinite"/>
  </g>
</svg>
