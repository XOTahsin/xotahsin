<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Md Tahsin Islam — Flutter Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05061a"/>
      <stop offset="1" stop-color="#0a0f24"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c4b5fd"/>
      <stop offset="0.65" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- aurora blobs -->
    <g filter="url(#blur)" opacity="0.85">
      <circle r="170" fill="#7c3aed">
        <animate attributeName="cx" values="200;420;260;200" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;180;260;60" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="160" fill="#0ea5e9">
        <animate attributeName="cx" values="1000;760;920;1000" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="260;80;200;260" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle r="130" fill="#14b8a6" opacity="0.8">
        <animate attributeName="cx" values="600;820;480;600" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="300;220;40;300" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle r="110" fill="#db2777" opacity="0.55">
        <animate attributeName="cx" values="900;600;1080;900" dur="22s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="20;140;120;20" dur="22s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- veil to keep text readable -->
    <rect width="1200" height="320" fill="#05061a" opacity="0.35"/>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <circle cx="90" cy="60" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="270" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="70" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="1020" cy="280" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="160" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="180" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="40" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="600" y="96" font-size="15" letter-spacing="7" fill="#a5f3fc" opacity="0.85">HELLO, I'M
        <animate attributeName="opacity" values="0;0.85" dur="1.2s" fill="freeze"/>
      </text>
      <text x="600" y="178" font-size="80" font-weight="800" letter-spacing="1" fill="url(#shine)" filter="url(#glow)">Md Tahsin Islam
        <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/>
      </text>
      <rect x="400" y="204" width="400" height="2" rx="1" fill="url(#line)">
        <animate attributeName="width" values="0;400" dur="1.6s" fill="freeze"/>
        <animate attributeName="x" values="600;400" dur="1.6s" fill="freeze"/>
      </rect>
      <text x="600" y="246" font-size="16" letter-spacing="6" fill="#cbd5e1" opacity="0.8">FLUTTER DEVELOPER  ·  MOBILE UI/UX  ·  BANGLADESH</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="319" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
