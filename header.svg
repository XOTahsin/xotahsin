<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" role="img" aria-label="Md Tahsin Islam">
  <title>Md Tahsin Islam</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset=".5" stop-color="#161e4a">
        <animate attributeName="offset" values=".3;.7;.3" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0b1026"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#9fe3ff"/>
      <stop offset="1" stop-color="#c9a7ff"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="210" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="999" height="209" rx="18" fill="none" stroke="#6ee7ff" stroke-opacity=".25"/>

  <!-- floating particles -->
  <g fill="#6ee7ff">
    <circle cx="90" cy="150" r="2" opacity=".5"><animate attributeName="cy" values="170;40;170" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="60" r="1.5" opacity=".4"><animate attributeName="cy" values="60;170;60" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="170" r="2" opacity=".35"><animate attributeName="cy" values="170;50;170" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="40" r="1.5" opacity=".4"><animate attributeName="cy" values="40;170;40" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="165" r="2" opacity=".45"><animate attributeName="cy" values="165;45;165" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="70" r="1.5" opacity=".4"><animate attributeName="cy" values="70;165;70" dur="11s" repeatCount="indefinite"/></circle>
  </g>

  <text x="500" y="62" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="9" fill="#6ee7ff" opacity="0">
    HELLO, I'M
    <animate attributeName="opacity" values="0;.9" dur="1s" fill="freeze"/>
  </text>

  <text x="500" y="125" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="3" fill="url(#txt)" opacity="0">
    Md Tahsin Islam
    <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/>
  </text>

  <rect x="500" y="140" width="0" height="2" fill="#6ee7ff" opacity=".7">
    <animate attributeName="x" values="500;380" dur="1.6s" fill="freeze"/>
    <animate attributeName="width" values="0;240" dur="1.6s" fill="freeze"/>
  </rect>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="6" fill="#9fb4e8" text-anchor="middle">
    <text x="500" y="176" opacity="0">
      WEB DEVELOPER
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.28;.33;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="176" opacity="0">
      BASED IN BANGLADESH
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.28;.33;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="176" opacity="0">
      ALWAYS LEARNING · ALWAYS BUILDING
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.28;.33;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
